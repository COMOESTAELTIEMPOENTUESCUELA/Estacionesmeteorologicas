name: Actualizar datos de la EMA Davis

# El servidor de la Facultad (meteo.fcaglp.unlp.edu.ar) no tiene CORS habilitado,
# así que el navegador no puede pedirle el archivo directamente desde la página
# (ver PR #57/#59). Este workflow baja el archivo cada 15 minutos desde los
# servidores de GitHub (sin restricción de CORS, es solo lectura, no toca nada
# de la estación) y lo guarda dentro del propio repositorio, para que la página
# lea esa copia en vez del servidor original.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar el archivo de la estación Davis
        run: |
          mkdir -p data
          set +e
          # -k: el certificado SSL del servidor de la Facultad no valida (curl
          # exit code 60, típico de certificados autofirmados/mal configurados en
          # infraestructura institucional). El archivo es de solo lectura y no
          # tiene datos sensibles ni credenciales, así que se acepta el riesgo.
          HTTP_CODE=$(curl -s -k -L --max-time 30 -A "Mozilla/5.0 (compatible; EstacionesMeteorologicasBot/1.0)" \
            -w "%{http_code}" -o /tmp/davis.txt "https://meteo.fcaglp.unlp.edu.ar/davis/campo/downld08.txt")
          CURL_EXIT=$?
          set -e
          echo "curl exit code: $CURL_EXIT, HTTP status: $HTTP_CODE"
          if [ "$CURL_EXIT" = "0" ] && [ "$HTTP_CODE" = "200" ] && [ -s /tmp/davis.txt ]; then
            mv /tmp/davis.txt data/davis-ultimo.txt
          else
            echo "No se pudo descargar el archivo; se mantiene la copia anterior si existe. Primeras líneas de la respuesta (si hay):"
            head -c 500 /tmp/davis.txt 2>/dev/null || true
          fi

      - name: Commitear si cambió
        run: |
          if [ ! -f data/davis-ultimo.txt ]; then
            echo "Todavía no hay archivo para commitear (la descarga falló y no había una copia previa)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/davis-ultimo.txt
          if git diff --staged --quiet; then
            echo "Sin cambios, no hace falta commitear."
          else
            git commit -m "Actualizar datos de la EMA Davis"
            git push
          fi
