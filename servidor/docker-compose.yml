# Servicios del servidor meteorológico.
#
#   docker compose up -d                      -> base de datos + ingesta
#   docker compose --profile satelite up -d   -> además, el satélite
#   docker compose logs -f ingesta            -> ver qué está haciendo
#
# Las rutas y contraseñas salen del archivo .env (copiar .env.example).

# Para que los logs no llenen el disco con los meses.
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:

  # Base de datos: PostgreSQL 16 + TimescaleDB (series de tiempo).
  db:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: meteo
      POSTGRES_USER: meteo
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
      # Memoria pensada para una PC con 12 GB de RAM.
      TS_TUNE_MEMORY: 3GB
    volumes:
      - ${DB_DIR:-./datos/db}:/var/lib/postgresql/data   # va en el SSD (rápido)
      - ./db/init:/docker-entrypoint-initdb.d:ro           # esquema inicial
      - ${BACKUP_DIR:-./datos/backups}:/backups
    # Solo accesible desde la propia PC (127.0.0.1), no desde la red.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meteo -d meteo"]
      interval: 10s
      retries: 10

  # Recolecta EMAs, sinópticas, reportes de la comunidad y pronósticos.
  ingesta:
    build: ./app
    image: meteo-app
    restart: unless-stopped
    logging: *logging
    command: python -m meteo.ingesta servicio
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://meteo:${DB_PASSWORD}@db:5432/meteo
      ESTACIONES_CONFIG: /config/estaciones.yaml
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./config:/config:ro

  # Imágenes del GOES-19 (se activa con --profile satelite).
  satelite:
    image: meteo-app
    build: ./app
    restart: unless-stopped
    logging: *logging
    profiles: ["satelite"]
    command: python -m meteo.satelite servicio
    environment:
      SATELITE_CONFIG: /config/satelite.yaml
      ARCHIVO_DIR: /archivo
    volumes:
      - ./config:/config:ro
      - ${ARCHIVO_DIR:-./datos/archivo}:/archivo          # va en el disco grande
