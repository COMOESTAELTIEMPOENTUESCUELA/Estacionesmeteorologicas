# =====================================================================
# Correcciones a mano de pronósticos (ver ingesta/correcciones.py)
# =====================================================================
# Dos tipos: FECHA equivocada ("mover_dias") y VALOR mal tipeado ("valores").
#
# --- Fecha equivocada ---
# Cada una: la emisión de esa ciudad, guardada con "fecha_guardada", de
# esa persona (y esa hora escrita, si la tiene) se corre "mover_dias".
# "huella" (opcional) la identifica sin dudas: conviene ponerla cuando la
# misma persona podría publicar de verdad para esa fecha más adelante.
# "publicado_el" es el día real en que se publicó. Esto es también el
# REGISTRO de lo corregido: no borrar entradas.
#
# Para encontrarlas: en la hoja "Pronosticos", una fila con forecast_date
# posterior al día de timestamp_guardado publicada a la MAÑANA (turno
# noche a propósito se publica de noche). Revisado el 12/10/2026 con la
# hoja completa: 8 casos, todos con "para mañana" tildado cerca de las 8.
# El contenido lo confirma (ej. La Plata 9/10: su "Día 1" coincide con el
# viernes del pronóstico del jueves, no con el sábado).

correcciones:
  - {ciudad: Mar del Plata, fecha_guardada: 2026-09-05, publicado_por: Micaela, hora_emision: "08:20:00",
     mover_dias: -1, publicado_el: 2026-09-04, motivo: "guardado 04/09 08:23 con 'para mañana' tildado"}
  - {ciudad: La Plata, fecha_guardada: 2026-09-16, publicado_por: Micaela, hora_emision: "08:10:00",
     mover_dias: -1, publicado_el: 2026-09-15, motivo: "guardado 15/09 08:09 con 'para mañana' tildado"}
  - {ciudad: Junín, fecha_guardada: 2026-09-19, publicado_por: Micaela, hora_emision: "08:00:00",
     mover_dias: -1, publicado_el: 2026-09-18, motivo: "guardado 18/09 08:11 con 'para mañana' tildado"}
  - {ciudad: La Plata, fecha_guardada: 2026-09-23, publicado_por: Micaela, hora_emision: "08:00:00",
     mover_dias: -1, publicado_el: 2026-09-22, motivo: "guardado 22/09 08:07 con 'para mañana' tildado"}
  - {ciudad: Bahía Blanca, fecha_guardada: 2026-10-01, publicado_por: Micaela, hora_emision: "08:00:00",
     mover_dias: -1, publicado_el: 2026-09-30, motivo: "guardado 30/09 08:13 con 'para mañana' tildado"}
  - {ciudad: Mar del Plata, fecha_guardada: 2026-10-03, publicado_por: Micaela, hora_emision: "08:00:00",
     mover_dias: -1, publicado_el: 2026-10-02, motivo: "guardado 02/10 08:06 con 'para mañana' tildado"}
  - {ciudad: La Plata, fecha_guardada: 2026-10-10, publicado_por: Micaela, hora_emision: "08:00:00",
     mover_dias: -1, publicado_el: 2026-10-09, motivo: "guardado 09/10 08:14 con 'para mañana' tildado"}
  # Guardado el 12/10 a la mañana como del 13 y no se volvió a publicar en el
  # día. Con huella: Micaela podría publicar de verdad Bahía Blanca para el 13.
  - {ciudad: Bahía Blanca, fecha_guardada: 2026-10-13, publicado_por: Micaela, hora_emision: "08:30:00",
     huella: 27937321730276a2df4c3bcbd36b0c9e,
     mover_dias: -1, publicado_el: 2026-10-12, motivo: "guardado 12/10 08:45 con 'para mañana' tildado"}

  # --- Valor mal tipeado ---
  # "dia" es el día pronosticado que tiene el error; "valores" puede tener
  # temp_min, temp_max, temp_min_suburbana, temp_max_suburbana. OJO: editar
  # la hoja "Pronosticos" a mano NO alcanza (el portal y el servidor leen la
  # columna json_completo, no las columnas sueltas): se corrige acá.
  - {ciudad: Mar del Plata, fecha_guardada: 2026-10-28, publicado_por: Mate, dia: 2026-10-28,
     valores: {temp_min: 4}, motivo: "tipeó 14 en vez de 4 (avisado el 29/10)"}
