# =====================================================================
# Pronósticos publicados con la fecha equivocada (ver ingesta/correcciones.py)
# =====================================================================
# Cada una: la emisión de esa ciudad, guardada con "fecha_guardada", de
# esa persona (y esa hora escrita, si la tiene) se corre "mover_dias".
# "publicado_el" es el día real en que se publicó. Esto es también el
# REGISTRO de lo corregido: no borrar entradas.
#
# Para encontrarlas: en la hoja "Pronosticos", una fila con forecast_date
# posterior al día de timestamp_guardado publicada a la MAÑANA (turno
# noche a propósito se publica de noche). Revisado el 12/10/2026 con la
# hoja completa: 8 casos, todos con "para mañana" tildado cerca de las 8.
# El contenido lo confirma (ej. La Plata 9/10: su "Día 1" coincide con el
# viernes del pronóstico del jueves, no con el sábado).

correcciones:
