pronosticos:
  url: https://script.google.com/macros/s/AKfycbyKbRPl7kgOPJWsDtq_2eb7Da6P8iDGvF75_-D55Rwo0xn3WSv_eJnQe2Azgwj4i3XS/exec
  ciudades: [La Plata, Junín, Mar del Plata, Bolívar, Tandil, Bahía Blanca]
