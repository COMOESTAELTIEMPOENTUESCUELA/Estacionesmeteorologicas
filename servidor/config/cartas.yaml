# =====================================================================
# Cartas de diagnóstico para el análisis de eventos (pestaña "Cartas")
# =====================================================================
# Se guardan en ARCHIVO_DIR/cartas/<producto>/<año>/<mes>/ y se ven en el
# visualizador con un selector de fecha y hora. Ver docs/06-cartas.md.

# Horas a guardar (UTC). Cada carta puede tener las suyas con "horas_utc".
horas_utc: [0, 6, 12, 18]

productos:
  # --- Cartas propias: análisis del GFS dibujado en el servidor -----------
  # APAGADAS (29/10/2026): `activo: false` en las cuatro. No se dibujan, no se
  # baja nada del GFS y no se muestran (tampoco lo ya dibujado). Para
  # retomarlas, sacar esas líneas.
  # Reemplazan a las de Bentley (mismos cuatro campos). Ver
  # app/meteo/cartas/diagnostico.py. Bajan ~16 MB por hora sinóptica (solo las
  # variables necesarias) del bucket público de NOAA, que guarda los análisis
  # desde 2021: `historico cartas --desde ... --hasta ...` dibuja eventos viejos.
  # Las cuatro comparten región (la de la primera) y el mismo marco.
  - id: gfs_presion_chorro
    nombre: "Presión, espesor 1000/500 hPa y corriente en chorro (250 hPa)"
    nivel: "Diagnóstico GFS"
    fuente: gfs
    dominio: sudamerica
    carta: presion_chorro
    activo: false
    region: [-95, -25, -60, 5]          # lon mín, lon máx, lat mín, lat máx
  - id: gfs_thetae_850
    nombre: "Temperatura potencial equivalente, altura y viento (850 hPa)"
    nivel: "Diagnóstico GFS"
    fuente: gfs
    dominio: sudamerica
    carta: thetae_850
    activo: false
  - id: gfs_ivt
    nombre: "Transporte integrado de vapor (IVT) y presión"
    nivel: "Diagnóstico GFS"
    fuente: gfs
    dominio: sudamerica
    carta: ivt
    activo: false
  - id: gfs_vorticidad_500
    nombre: "Vorticidad relativa, altura y viento (500 hPa)"
    nivel: "Diagnóstico GFS"
    fuente: gfs
    dominio: sudamerica
    carta: vorticidad_500
    activo: false

  # --- Pronóstico del GFS dibujado en el servidor (formato Bentley) --------
  # Todos los plazos (+0 a +192 h, cada 6 h) de la ÚLTIMA corrida del GFS,
  # con el mismo formato y colores que las cartas de Alicia Bentley. Se ven en
  # la tarjeta "Pronóstico GFS" de la pestaña Cartas. Se guardan las corridas
  # de los últimos 8 días (para compararlas entre sí y con lo que pasó) y se
  # borran solas las más viejas: ~800 MB fijos en disco. Bajan ~15 MB por
  # plazo de NOAA (~500 MB por corrida, 4 corridas por día) y tardan ~15-25 min
  # en dibujarse. Ver app/meteo/cartas/estilo_bentley.py.
  # Para apagarlas: `activo: false` en las cuatro.
  - id: gfs_pro_mslp_jet
    nombre: "Presión, espesor 1000/500 hPa y corriente en chorro"
    nivel: "Superficie y 1000/500 hPa"
    fuente: gfs_pronostico
    carta: mslp_jet
  - id: gfs_pro_850_thetae
    nombre: "Temperatura potencial equivalente"
    nivel: "850 hPa"
    fuente: gfs_pronostico
    carta: 850_thetae
  - id: gfs_pro_ivt
    nombre: "Transporte integrado de vapor (IVT)"
    nivel: "700 hPa"
    fuente: gfs_pronostico
    carta: ivt
  - id: gfs_pro_500_vort
    nombre: "Vorticidad, temperatura y ascenso"
    nivel: "500 hPa"
    fuente: gfs_pronostico
    carta: 500_vort

  # El +0 h (análisis) de cada corrida del pronóstico de arriba se ARCHIVA
  # para siempre, como las demás cartas de cada hora (~1 GB por año): mismo
  # formato que el pronóstico, para compararlo con lo que pasó.
  - id: gfs_ana_mslp_jet
    nombre: "Presión, espesor 1000/500 hPa y corriente en chorro"
    nivel: "Superficie y 1000/500 hPa (GFS)"
    fuente: gfs_analisis
    carta: mslp_jet
  - id: gfs_ana_850_thetae
    nombre: "Temperatura potencial equivalente"
    nivel: "850 hPa (GFS)"
    fuente: gfs_analisis
    carta: 850_thetae
  - id: gfs_ana_ivt
    nombre: "Transporte integrado de vapor (IVT)"
    nivel: "700 hPa (GFS)"
    fuente: gfs_analisis
    carta: ivt
  - id: gfs_ana_500_vort
    nombre: "Vorticidad, temperatura y ascenso"
    nivel: "500 hPa (GFS)"
    fuente: gfs_analisis
    carta: 500_vort

  # --- Página de Alicia Bentley (GFS, análisis): respaldo y comparación ----
  # `pronostico: false`: de su página se bajan solo los ANÁLISIS; el
  # pronóstico sale de las cartas propias de arriba (29/10/2026: su página
  # publicó la misma imagen vieja en todos los cuadros de pronóstico).
  # https://www.atmos.albany.edu/student/abentley/realtime/standard.php?domain=southamer&variable=VARIABLE
  # Se siguen bajando junto con las propias: para comparar y por si una de las
  # dos falla (si la página se cae, lo demás se baja igual). La página muestra
  # 14 días: al volver de una caída, recupera lo que faltó. Para dejar de
  # bajarlas sin perder lo archivado: `descargar: false` en las cuatro.
  - id: bentley_mslp_jet
    nombre: "Presión, espesor 1000/500 hPa y corriente en chorro"
    nivel: "Superficie y 1000/500 hPa (Bentley)"
    fuente: bentley
    dominio: southamer
    variable: mslp_jet
    pronostico: false
  - id: bentley_850_thetae
    nombre: "Temperatura potencial equivalente"
    nivel: "850 hPa (Bentley)"
    fuente: bentley
    dominio: southamer
    variable: 850_thetae
    pronostico: false
  - id: bentley_ivt_conv
    nombre: "Transporte integrado de vapor (IVT) y convergencia"
    nivel: "700 hPa (Bentley)"
    fuente: bentley
    dominio: southamer
    variable: IVT_conv
    pronostico: false
  - id: bentley_rel_vort
    nombre: "Vorticidad relativa"
    nivel: "500 hPa (Bentley)"
    fuente: bentley
    dominio: southamer
    variable: rel_vort
    pronostico: false

  # --- Satélite GOES-19 (NOAA STAR, gratis) --------------------------------
  # Sector "ssa" (sur de Sudamérica), 1800x1080. Solo a las horas de las
  # cartas: la imagen más cercana a cada hora sinóptica (±10 min).
  - id: satelite_ir13
    nombre: "Infrarrojo (canal 13)"
    nivel: "Satélite GOES-19"
    fuente: star
    sector: ssa
    banda: "13"
  - id: satelite_geocolor
    nombre: "GeoColor (visible de día, infrarrojo de noche)"
    nivel: "Satélite GOES-19"
    fuente: star
    sector: ssa
    banda: GEOCOLOR
  - id: satelite_wv08
    nombre: "Vapor de agua, niveles altos (canal 8, 6,2 µm)"
    nivel: "Satélite GOES-19"
    fuente: star
    sector: ssa
    banda: "08"
  - id: satelite_wv09
    nombre: "Vapor de agua, niveles medios (canal 9, 6,9 µm)"
    nivel: "Satélite GOES-19"
    fuente: star
    sector: ssa
    banda: "09"
  - id: satelite_wv10
    nombre: "Vapor de agua, niveles medio-bajos (canal 10, 7,3 µm)"
    nivel: "Satélite GOES-19"
    fuente: star
    sector: ssa
    banda: "10"
  # Air Mass: combinación de canales (RGB) que distingue masas de aire por
  # temperatura y humedad: rojo/naranja = aire seco de capas altas (intrusión
  # estratosférica, cerca de ciclones y corrientes en chorro), verde = masa
  # cálida y húmeda tropical, azul/violeta = aire frío polar, blanco = nubes
  # altas y gruesas. Muy útil para ubicar vaguadas y frentes.
  - id: satelite_airmass
    nombre: "Air Mass (RGB de masas de aire)"
    nivel: "Satélite GOES-19"
    fuente: star
    sector: ssa
    banda: AirMass
  # Rayos: mapa PROPIO con los destellos crudos del GLM de los 60 min previos
  # a la hora de la carta, sobre el canal 13 en grises, recortado a la región.
  # Solo se arma si alguna estación sinóptica de la región informó tormenta en
  # el SYNOP (ww 13, 17, 29, 91-99) cerca de esa hora: baja ~180 archivos
  # (unos 30-90 MB) por mapa, así que no se hace "por las dudas". NOAA guarda
  # el GLM para siempre: un evento pasado se puede dibujar a pedido con
  #   historico cartas --desde ... --hasta ... --forzar
  - id: satelite_rayos_bsas
    nombre: "Rayos (GLM, 60 min previos) sobre infrarrojo · Buenos Aires y Uruguay"
    nivel: "Satélite GOES-19"
    fuente: glm
    solo_con_tormenta: true
    minutos: 60
    region: [-64.0, -53.0, -41.3, -30.0]     # lon mín, lon máx, lat mín, lat máx
    titulo_region: "Buenos Aires, Uruguay y sur del Litoral"
    puntos:
      - {etiqueta: La Plata, lat: -34.92, lon: -57.95}
      - {etiqueta: Buenos Aires, lat: -34.60, lon: -58.38, dx: -1.5, dy: 0.1}
      - {etiqueta: Junín, lat: -34.58, lon: -60.95}
      - {etiqueta: Tandil, lat: -37.32, lon: -59.13}
      - {etiqueta: Mar del Plata, lat: -38.00, lon: -57.55}
      - {etiqueta: Bahía Blanca, lat: -38.72, lon: -62.27}
      - {etiqueta: Montevideo, lat: -34.90, lon: -56.16}
      - {etiqueta: Rosario, lat: -32.95, lon: -60.65}
  # Rayos: densidad de destellos del GLM (detector de relámpagos del GOES)
  # sobre el GeoColor. Es otro instrumento: otra carpeta en NOAA.
  - id: satelite_glm
    nombre: "Rayos (GLM) sobre GeoColor"
    nivel: "Satélite GOES-19"
    fuente: star
    instrumento: GLM
    sector: ssa
    banda: EXTENT3

  # --- Ogimet: mapas de observaciones de superficie ----------------------
  # https://www.ogimet.com/cgi-bin/gsynop?zona=amersurs&... : una consulta
  # trae ~12 mapas de esa hora; "codigo" elige cuál (Te temperatura, Td rocío,
  # Tx máxima, Tn mínima, Sg, R2, R4, Pr, Hr, Wi, Dt, Hi). Ogimet solo tiene
  # los mapas del último día: el historial se arma archivándolos a diario.
  # Los mapas son transparentes; la geografía se baja una vez por zona a
  # cartas/_fondos/ y el visualizador la pone debajo.
  # A las 00, 06, 12 y 18 UTC: tiempo presente y temperatura.
  - id: ogimet_tiempo_significativo
    nombre: "Tiempo presente (observaciones)"
    nivel: "Superficie"
    fuente: ogimet
    zona: amersurs
    codigo: Sg
  - id: ogimet_temperatura
    nombre: "Temperatura (observaciones)"
    nivel: "Superficie"
    fuente: ogimet
    zona: amersurs
    codigo: Te
  # La precipitación de 24 h y las temperaturas extremas se informan a las
  # 12 UTC: a otras horas el mapa sale casi vacío.
  - id: ogimet_precipitacion
    nombre: "Precipitación acumulada (observaciones)"
    nivel: "Superficie"
    fuente: ogimet
    zona: amersurs
    codigo: R4
    horas_utc: [12]
  - id: ogimet_maxima
    nombre: "Temperatura máxima (observaciones)"
    nivel: "Superficie"
    fuente: ogimet
    zona: amersurs
    codigo: Tx
    horas_utc: [12]
  - id: ogimet_minima
    nombre: "Temperatura mínima (observaciones)"
    nivel: "Superficie"
    fuente: ogimet
    zona: amersurs
    codigo: Tn
    horas_utc: [12]
